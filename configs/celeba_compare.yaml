extends: celeba.yaml
experiment:
  name: celeba_dct_compare
data:
  target: datasets.src.datasets_loader:load_common_celeba
  train_limit: null
  tokenizer_fit_limit: 20000
  evaluation_split: test
model:
  params:
    d_model: 512
    n_heads: 8
    n_layers: 8
    d_ff: 2048
    dropout: 0.0
training:
  epochs: 1
  max_steps: 10000
  checkpoint_interval: 1000
  precision: fp16
  eval_interval: 500
  max_val_batches: 20
metrics:
  names: [fid, is, precision, recall]
  encoders: [inception]
  train_interval: null
generation:
  num_images: 1000
  batch_size: 25
  temperature: 1.0
  top_k: null
tokenizer:
  params:
    normalization:
      transform: none
      scaling: minmax
      per_position: true
