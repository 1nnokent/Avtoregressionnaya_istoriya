extends: base.yaml
experiment:
  name: celeba_dct
  device: auto
data:
  target: datasets.src.datasets_loader:load_common_celeba
  params:
    ds_name: celeba
    gray: false
    size: 32                 # одно разрешение для всех моделей
  train_limit: null
  tokenizer_fit_limit: 20000
  batch_size: 16             # 32 не влезает в T4 (OOM); шагов вдвое больше, данных столько же
  evaluation_split: test
model:
  params:
    d_model: 512
    n_heads: 8
    n_layers: 8              # ~25M параметров; 24 слоя = масштаб iGPT, но обучение намного дольше
    d_ff: 2048
    dropout: 0.0
training:
  epochs: 1
  max_steps: 10000           # 10000 × 16 = 160k картинок, столько же видели iGPT и flow
  checkpoint_interval: 1000  # step_1000 ... step_10000 = 32k ... 160k картинок
  precision: fp16
  eval_interval: 500
  max_val_batches: 20
metrics:
  names: [ fid, is, precision, recall ]
  encoders: [inception]
  train_interval: null       # промежуточные метрики дорогие; считаем в конце
generation:
  num_images: 1000             # как у iGPT и диффузии
  batch_size: 25             # KV-кеш генерации в fp32; 100 не влезает в T4
  temperature: 1.0           # как у iGPT; 0.7 занижает разнообразие (recall)
  top_k: null
tokenizer:
  params:
    normalization:
      transform: none          # победитель pipeline_demo.ipynb: без signed_log
      scaling: minmax
      per_position: true       # свой min/max для каждой позиции (частоты)